<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#25333A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tiny Rugby Simulator</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preload" href="./fonts/display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/block-600.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:TTDisplay;src:url(./fonts/display.woff2) format("woff2");font-display:block}
@font-face{font-family:TTSans;font-weight:600;src:url(./fonts/sans-600.woff2) format("woff2");font-display:block}
@font-face{font-family:TTSans;font-weight:700;src:url(./fonts/sans-700.woff2) format("woff2");font-display:block}
@font-face{font-family:TTBlock;font-weight:600;src:url(./fonts/block-600.woff2) format("woff2");font-display:block}
@font-face{font-family:TTBlock;font-weight:700;src:url(./fonts/block-700.woff2) format("woff2");font-display:block}
html,body{margin:0;width:100%;height:100%;background:#25333A;overflow:hidden;position:fixed;inset:0;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;top:0;left:0;display:block;touch-action:none}
#safe{position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body><div id="safe"></div><canvas id="c"></canvas><script type="module" src="/src/main.ts"></script></body>
</html>
